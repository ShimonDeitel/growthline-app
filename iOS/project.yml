name: Growthline
options:
  bundleIdPrefix: com.shimondeitel.growthchild
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Growthline:
    type: application
    platform: iOS
    sources:
      - path: Growthline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.growthchild
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Growthline/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  GrowthlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GrowthlineTests
      - path: Growthline.storekit
    dependencies:
      - target: Growthline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.growthchild.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  GrowthlineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GrowthlineUITests
    dependencies:
      - target: Growthline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.growthchild.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Growthline:
    build:
      targets:
        Growthline: all
        GrowthlineTests: [test]
        GrowthlineUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Growthline.storekit
    test:
      config: Debug
      storeKitConfiguration: Growthline.storekit
      targets:
        - GrowthlineTests
        - GrowthlineUITests
    archive:
      config: Release
